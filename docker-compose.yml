version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caninevision-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    environment:
      - LOG_LEVEL=INFO
      - APP_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caninevision-ui
    command: ["streamlit", "run", "app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
