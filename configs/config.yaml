# =============================================================================
# CanineVision AI — Master Configuration
# Project: PRAICP-1007-120 Dog Breeds Classification
# =============================================================================

project:
  name: "CanineVision AI"
  version: "1.0.0"
  description: "Intelligent Dog Breed Recognition System — 120 Breeds"
  id: "PRAICP-1007-120"

# ---------------------------------------------------------------------------
# Paths (relative to project root)
# ---------------------------------------------------------------------------
paths:
  dataset_root: "dog-breed-120/Dogs class"
  data_processed: "data/processed"
  data_splits: "data/splits"
  artifacts_models: "artifacts/models"
  artifacts_class_mapping: "artifacts/class_mapping"
  artifacts_metadata: "artifacts/metadata"
  artifacts_reports: "artifacts/reports"
  outputs_eda: "outputs/eda"
  outputs_training: "outputs/training"
  outputs_evaluation: "outputs/evaluation"
  outputs_gradcam: "outputs/gradcam"
  outputs_predictions: "outputs/predictions"
  mlflow_tracking: "mlruns"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  num_classes: 120
  image_format: "jpg"
  junk_folders:
    - "Untitled Folder"

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed:
  python_seed: 42
  numpy_seed: 42
  tensorflow_seed: 42

# ---------------------------------------------------------------------------
# Data splits (must sum to 1.0)
# ---------------------------------------------------------------------------
splits:
  train: 0.70
  val: 0.15
  test: 0.15

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  image_size: [224, 224]
  channels: 3
  # Custom CNN: simple pixel normalisation to [0, 1]
  # MobileNetV2 / EfficientNetB0: use model-specific preprocess_input functions
  # (DO NOT apply /255 manually when using those functions)

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
