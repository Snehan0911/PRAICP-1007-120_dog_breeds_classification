# =============================================================================
# CanineVision AI — Model Architecture Configuration
# =============================================================================

models:

  custom_cnn:
    name: "CustomCNN"
    version: "1.0"
    input_shape: [224, 224, 3]
    num_classes: 120
    architecture:
      conv_blocks:
        - filters: 32
          kernel_size: 3
          pool_size: 2
          dropout: 0.25
        - filters: 64
          kernel_size: 3
          pool_size: 2
          dropout: 0.25
        - filters: 128
          kernel_size: 3
          pool_size: 2
          dropout: 0.25
        - filters: 256
          kernel_size: 3
          pool_size: 2
          dropout: 0.25
      dense_units: 512
      dense_dropout: 0.5
      activation: "relu"
      output_activation: "softmax"
    preprocessing: "normalize_01"       # Simple /255 normalisation

  mobilenet_v2:
    name: "MobileNetV2"
    version: "1.0"
    input_shape: [224, 224, 3]
    num_classes: 120
    backbone: "MobileNetV2"
    backbone_weights: "imagenet"
    freeze_backbone: true               # Phase 1: freeze all backbone layers
    fine_tune_at: -30                   # Phase 2: unfreeze last 30 layers
    head:
      global_average_pooling: true
      dropout: 0.3
      dense_units: 256
      dense_dropout: 0.3
    preprocessing: "mobilenet_v2"       # tf.keras.applications.mobilenet_v2.preprocess_input

  efficientnet_b0:
    name: "EfficientNetB0"
    version: "1.0"
    input_shape: [224, 224, 3]
    num_classes: 120
    backbone: "EfficientNetB0"
    backbone_weights: "imagenet"
    freeze_backbone: true
    fine_tune_at: -20                   # Unfreeze last 20 layers for fine-tuning
    head:
      global_average_pooling: true
      dropout: 0.3
      dense_units: 256
      dense_dropout: 0.3
    preprocessing: "efficientnet"       # tf.keras.applications.efficientnet.preprocess_input

# Active model for inference (set after experiments)
active_model: "mobilenet_v2"
