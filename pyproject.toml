[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-breeds-classification"
version = "1.0.0"
description = "Dog Breeds Classification (PRAICP-1007-120) – Fine-grained deep learning canine recognition across 120 breeds with Grad-CAM explainability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Principal AI/ML Engineering Team" }
]
keywords = [
    "deep-learning",
    "computer-vision",
    "image-classification",
    "dog-breeds",
    "stanford-dogs",
    "transfer-learning",
    "mobilenetv2",
    "grad-cam",
    "explainable-ai",
    "tensorflow",
    "keras",
    "flask"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tensorflow>=2.18.0,<2.22.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "pillow>=11.0.0",
    "opencv-python>=4.10.0",
    "scikit-learn>=1.6.0",
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.0",
    "python-dotenv>=1.0.1",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
